name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string

permissions: {}

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    name: Complete release gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - name: Identify release source
        id: source
        run: |
          sha=$(git rev-parse HEAD)
          test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go run github.com/magefile/mage@v1.17.2 check

  release:
    name: Publish artifacts
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ needs.test.outputs.source_sha }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}
      - name: Generate and upload SBOMs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go install github.com/anchore/syft/cmd/syft@v1.46.0
          version="${RELEASE_TAG#v}"
          syft scan dir:dist -o "spdx-json=dist/fibe_$version.spdx.json"
          syft scan dir:dist -o "cyclonedx-json=dist/fibe_$version.cyclonedx.json"
          gh release upload "$RELEASE_TAG" dist/*.spdx.json dist/*.cyclonedx.json --clobber
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/*.spdx.json
            dist/*.cyclonedx.json

  verify:
    name: Verify published release
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
    steps:
      - name: Download and verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          version="${TAG#v}"
          gh release download "$TAG" --repo "$REPOSITORY" --pattern "fibe_${version}_linux_amd64.tar.gz" --pattern checksums.txt --pattern "*.spdx.json" --pattern "*.cyclonedx.json"
          grep "fibe_${version}_linux_amd64.tar.gz" checksums.txt | sha256sum -c -
          test -s "fibe_${version}.spdx.json"
          test -s "fibe_${version}.cyclonedx.json"
          tar -xzf "fibe_${version}_linux_amd64.tar.gz"
          ./fibe version
          ./fibe --help >/dev/null
          mkdir -p /tmp/fibe-release-mock
          printf '%s\n' '{"status":"ok","domain":"mock","time_utc":"2026-01-01T00:00:00Z"}' >/tmp/fibe-release-mock/up.json
          python3 -m http.server 18080 --bind 127.0.0.1 --directory /tmp/fibe-release-mock >/tmp/fibe-release-mock/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          ./fibe --domain http://127.0.0.1:18080 server-info -o json | grep '"status": "ok"'

  notify:
    name: Notify release channel
    runs-on: ubuntu-latest
    needs: [release, verify]
    if: always() && needs.release.result == 'success'
    continue-on-error: true
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TAG: ${{ env.RELEASE_TAG }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then exit 0; fi
          payload="$(jq -n --arg text "[$REPOSITORY] SDK release $TAG is ready: $SERVER_URL/$REPOSITORY/releases/tag/$TAG" '{text:$text}')"
          curl -fsS -X POST -H 'Content-Type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL" >/dev/null
